name: Deploy to Cloud

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Add host to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts
        
    - name: Deploy to Cloud Host
      env:
        HOST: ${{ secrets.HOST }}
        USER: ${{ secrets.USER }}
        MODULE: gift
      run: |
        echo "🚀 Deploying $MODULE to $HOST..."
        
        # Sync files to remote (exclude sensitive/build files)
        rsync -avz --delete \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.wrangler' \
          --exclude='.github' \
          --exclude='*.log' \
          --exclude='*.sqlite' \
          --exclude='*.sqlite3' \
          --exclude='*.db' \
          --exclude='test.js' \
          --exclude='TESTING.md' \
          ./ \
          $USER@$HOST:/home/ubuntu/association/apps/$MODULE/
        
        # Build and restart container on remote
        ssh $USER@$HOST "cd /home/ubuntu/association/apps && sudo docker compose build $MODULE && sudo docker compose up -d $MODULE"
        
        echo "✅ Deployment completed!"
